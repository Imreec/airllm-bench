repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        args: [--strict]
        files: ^src/
        additional_dependencies:
          - "pydantic>=2.0"
          - "numpy>=1.26"
          - "pandas-stubs>=2.2"
          - "types-psutil>=5.9"

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: check-file-sizes
        name: Check file sizes (≤150 lines)
        entry: uv run python scripts/check_file_sizes.py
        language: system
        files: \.py$
        pass_filenames: false

      - id: check-anti-patterns
        name: Check for anti-patterns
        entry: uv run python scripts/check_anti_patterns.py
        language: system
        pass_filenames: false
      # check-no-hardcoded is added in Phase 3 (T3.5), once config + the watched constant exist.
