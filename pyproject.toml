[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airllm-bench"
version = "1.00"
description = "Benchmarking a massive LLM run locally via AirLLM + quantization: TTFT/TPOT/throughput/memory/power, economics, and a hierarchical roofline."
readme = "README.md"
# Capped below 3.13 deliberately: the heavy ML stack (torch/airllm/bitsandbytes) may lack
# wheels on the newest Python (per the brief's "Do" list). The G-SPIKE confirms the exact version.
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Imree Cohen (ID: 312359284)", email = "246479960+Imreec@users.noreply.github.com" },
    { name = "Eyal Shtinmetz (ID: 314884834)", email = "eyalshtinmetz@gmail.com" },
]

# Core deps: keyless Tier-1 analysis stack + lightweight hardware probes. CI installs these.
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "psutil>=5.9",
    "nvidia-ml-py>=12.0",
    # Scenario-matrix progress bar. In CORE (not the runtime extra) because the keyless
    # mock-runner orchestrator smoke test imports it; declared explicitly, not relied on
    # transitively via transformers (T5.4, Antigravity review).
    "tqdm>=4.66",
]

# Console entrypoint for the matrix driver (T5.4): `airllm-bench bench ...`.
[project.scripts]
airllm-bench = "airllm_bench.cli:main"

# Heavy model-runtime stack — hardware-bound (Tier-2) only. NEVER installed in CI.
[project.optional-dependencies]
# AirLLM path — what the G-SPIKE and the AirLLM/baseline runners need.
# Install on the GPU box: `uv sync --extra runtime`.
runtime = [
    "torch>=2.2",
    # <4.43: transformers 4.43 moved RoPE position_embeddings to the model level and passes
    # them down to layers; AirLLM drives layers itself with the OLDER self-contained-rotary API,
    # so >=4.43 crashes mid-generation ("cos, sin = position_embeddings" on None). G-SPIKE finding.
    # 4.42.x still supports Qwen2.5 (since 4.37) and satisfies the <4.49 bettertransformer cap.
    "transformers>=4.40,<4.43",
    "accelerate>=0.30",
    "airllm>=2.11",
    "bitsandbytes>=0.43",
    "huggingface-hub>=0.23",
    # airllm imports optimum.bettertransformer, removed in optimum 2.0 (G-SPIKE finding).
    "optimum>=1.14,<2",
    # airllm tokenizer deps not pulled transitively (G-SPIKE finding).
    "sentencepiece>=0.2",
    "protobuf>=4.0",
]
# The llama.cpp competitor (Phase 5) — isolated so its build-fragile wheel can NEVER block
# the AirLLM spike. May be swapped for an external Ollama install if it won't build on Windows.
# Install: `uv sync --extra runtime --extra llamacpp`.
llamacpp = [
    "llama-cpp-python>=0.2",
]

# torch must come from the CUDA index — PyPI serves CPU-only wheels on Windows, which
# defeats the whole experiment (G-SPIKE 01 caught torch==*+cpu). cu124 wheels run fine on
# the box's CUDA-13.1-capable driver. Only applies when the `runtime` extra is installed.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[tool.hatch.build.targets.wheel]
packages = ["src/airllm_bench"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ANN", "RET", "PT"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "S101"]
"scripts/**/*.py" = ["ANN"]
"spike/**/*.py" = ["ANN"]  # throwaway go/no-go scripts — not production code

[tool.ruff.lint.isort]
known-first-party = ["airllm_bench"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
warn_unreachable = true
warn_redundant_casts = true
exclude = ["tests/", "scripts/", "build/"]

# Un-stubbed third-party libs — let mypy treat them as Any so the strict check passes
# in CI without the heavy runtime stack installed.
[[tool.mypy.overrides]]
module = [
    "torch.*", "transformers.*", "accelerate.*", "airllm.*", "bitsandbytes.*",
    "llama_cpp.*", "pynvml.*", "matplotlib.*", "tqdm.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
minversion = "8.0"
addopts = "-ra --strict-markers"
pythonpath = ["src"]
markers = [
    "hardware: needs the GPU box (Tier-2) — excluded from keyless CI",
    "slow: marks slow tests",
]

[tool.coverage.run]
source = ["src/airllm_bench"]
branch = true
omit = ["**/__init__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
    "if TYPE_CHECKING:",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pandas-stubs>=2.2",
    "types-psutil>=5.9",
]
